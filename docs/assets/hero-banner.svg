<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C12"/>
      <stop offset="50%" stop-color="#161826"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C6F100" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wave-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C6F100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg-gradient)"/>

  <path d="M0,220 C300,160 450,280 700,210 C950,140 1050,240 1200,190 L1200,320 L0,320 Z" fill="url(#accent-glow)" opacity="0.12"/>
  <path d="M0,240 Q 300,180 600,250 T 1200,210" fill="none" stroke="url(#wave-path)" stroke-width="3" opacity="0.35" filter="url(#glow)"/>

  <!-- Exact App Launcher Icon from mipmap-xxxhdpi/ic_launcher.png -->
  <g transform="translate(100, 100)">
    <circle cx="60" cy="60" r="58" fill="#12131F" stroke="url(#wave-path)" stroke-width="2.5" filter="url(#glow)"/>
    <image href="app_icon.png" x="8" y="8" width="104" height="104" clip-path="circle(52px at 60px 60px)"/>
  </g>

  <!-- Title & Tagline -->
  <text x="250" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#FFFFFF" letter-spacing="2">LASTWAVE<tspan fill="#00E5FF">X</tspan></text>
  <text x="252" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#A0A5C0" letter-spacing="0.5">Modern Android Music Client &amp; Universal Last.fm Scrobbler</text>

  <!-- Badges -->
  <g transform="translate(252, 205)">
    <rect width="110" height="28" rx="14" fill="#C6F100" fill-opacity="0.15" stroke="#C6F100" stroke-opacity="0.4"/>
    <text x="55" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#C6F100" text-anchor="middle">v4.1.0 STABLE</text>

    <rect x="122" width="130" height="28" rx="14" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="187" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#A5B4FC" text-anchor="middle">ANDROID 10+</text>

    <rect x="264" width="90" height="28" rx="14" fill="#00E5FF" fill-opacity="0.15" stroke="#00E5FF" stroke-opacity="0.4"/>
    <text x="309" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#80D8FF" text-anchor="middle">GPLv3 FOSS</text>
  </g>
</svg>
